<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente de Voz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap');

    :root {
      --bg: #0d0f12;
      --surface: #13161b;
      --border: #1e2229;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.12);
      --accent-glow: rgba(0, 212, 255, 0.35);
      --text: #c8ced8;
      --text-dim: #4a5260;
      --red: #ff4d6a;
      --red-dim: rgba(255, 77, 106, 0.15);
      --green: #00e5a0;
      --green-dim: rgba(0, 229, 160, 0.15);
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 340px;
      height: 420px;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 14px;
      gap: 12px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent-dim);
      border: 1px solid rgba(0, 212, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .logo-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }

    .status-dot.listening {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── WAVEFORM ── */
    .waveform-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .waveform-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0, 212, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .mic-btn {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid rgba(0, 212, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      background: rgba(0, 212, 255, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .mic-btn.listening {
      background: var(--red-dim);
      border-color: var(--red);
      box-shadow: 0 0 24px rgba(255, 77, 106, 0.4);
      animation: mic-pulse 1s infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 24px rgba(255, 77, 106, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 36px rgba(255, 77, 106, 0.6); }
    }

    .mic-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    .mic-btn.listening svg {
      stroke: var(--red);
    }

    .waveform-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
    }

    .bar {
      width: 3px;
      background: var(--text-dim);
      border-radius: 2px;
      height: 4px;
      transition: height 0.1s ease, background 0.2s;
    }

    .bar.active {
      background: var(--accent);
      animation: wave 0.6s ease-in-out infinite alternate;
    }

    .bar:nth-child(1).active { animation-delay: 0s;    --h: 10px; }
    .bar:nth-child(2).active { animation-delay: 0.08s; --h: 18px; }
    .bar:nth-child(3).active { animation-delay: 0.16s; --h: 24px; }
    .bar:nth-child(4).active { animation-delay: 0.24s; --h: 20px; }
    .bar:nth-child(5).active { animation-delay: 0.32s; --h: 28px; }
    .bar:nth-child(6).active { animation-delay: 0.24s; --h: 22px; }
    .bar:nth-child(7).active { animation-delay: 0.16s; --h: 16px; }
    .bar:nth-child(8).active { animation-delay: 0.08s; --h: 10px; }
    .bar:nth-child(9).active { animation-delay: 0s;    --h: 6px; }

    @keyframes wave {
      from { height: 4px; }
      to   { height: var(--h, 12px); }
    }

    .hint-text {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ── AI MESSAGE AREA ── */
    .ai-message {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .ai-message.has-message {
      border-color: rgba(0, 212, 255, 0.25);
    }

    .ai-message.has-message::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      border-radius: 2px 0 0 2px;
    }

    .ai-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ai-label.active {
      color: var(--accent);
    }

    .ai-text {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
      font-style: italic;
      transition: color 0.3s;
    }

    .ai-text.has-content {
      color: var(--text);
      font-style: normal;
    }

    /* typing cursor */
    .cursor {
      display: inline-block;
      width: 7px;
      height: 12px;
      background: var(--accent);
      border-radius: 1px;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.9s step-start infinite;
      opacity: 0;
    }

    .cursor.visible { opacity: 1; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── TRANSCRIPT ── */
    .transcript {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
    }

    .transcript-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .transcript-text {
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .transcript-text.active {
      color: var(--text);
      font-style: normal;
    }

    /* ── FOOTER ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .model-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .settings-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: none;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .settings-btn:hover {
      border-color: var(--text-dim);
      background: var(--surface);
    }

    .settings-btn svg {
      width: 12px;
      height: 12px;
      stroke: var(--text-dim);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
        <div>
          <div class="logo-text">Assistente</div>
          <div class="logo-sub">VOICE CONTROL</div>
        </div>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">INATIVO</span>
      </div>
    </div>

    <!-- WAVEFORM / MIC -->
    <div class="waveform-area">
      <button class="mic-btn" id="micBtn" title="Pressione para falar">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <div class="waveform-bars" id="waveBars">
        <div class="bar" id="b1"></div>
        <div class="bar" id="b2"></div>
        <div class="bar" id="b3"></div>
        <div class="bar" id="b4"></div>
        <div class="bar" id="b5"></div>
        <div class="bar" id="b6"></div>
        <div class="bar" id="b7"></div>
        <div class="bar" id="b8"></div>
        <div class="bar" id="b9"></div>
      </div>
      <div class="hint-text" id="hintText">Clique no microfone para falar</div>
    </div>

    <!-- O QUE O USUÁRIO FALOU -->
    <div class="transcript">
      <span class="transcript-label">VOCÊ</span>
      <span class="transcript-text" id="transcriptText">aguardando fala...</span>
    </div>

    <!-- RESPOSTA DA IA (só aparece se necessário) -->
    <div class="ai-message" id="aiMessage">
      <div class="ai-label" id="aiLabel">IA</div>
      <div class="ai-text" id="aiText">
        Nenhuma mensagem pendente
        <span class="cursor" id="cursor"></span>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <span class="model-tag">gemini-2.5-flash</span>
      <button class="settings-btn" title="Configurações">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const API_KEY = "";

    const genAI = new GoogleGenerativeAI(API_KEY);

    // ── REFS ──
    const micBtn       = document.getElementById("micBtn");
    const statusDot    = document.getElementById("statusDot");
    const statusText   = document.getElementById("statusText");
    const hintText     = document.getElementById("hintText");
    const transcriptEl = document.getElementById("transcriptText");
    const aiMessage    = document.getElementById("aiMessage");
    const aiLabel      = document.getElementById("aiLabel");
    const aiText       = document.getElementById("aiText");
    const cursor       = document.getElementById("cursor");
    const bars         = document.querySelectorAll(".bar");

    let recognition;
    let isListening = false;

    // ── SPEECH RECOGNITION ──
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRec) {
      hintText.textContent = "Reconhecimento de voz não suportado";
      micBtn.disabled = true;
    } else {
      recognition = new SpeechRec();
      recognition.lang = "pt-BR";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        statusDot.classList.remove("active");
        statusDot.classList.add("listening");
        statusText.textContent = "OUVINDO";
        hintText.textContent = "Pode falar...";
        bars.forEach(b => b.classList.add("active"));
      };

      recognition.onresult = (e) => {
        const interim = Array.from(e.results)
          .map(r => r[0].transcript)
          .join("");
        transcriptEl.textContent = interim;
        transcriptEl.classList.add("active");

        if (e.results[e.results.length - 1].isFinal) {
          processCommand(interim.trim());
        }
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        statusDot.classList.remove("listening");
        bars.forEach(b => b.classList.remove("active"));
        if (!statusDot.classList.contains("active")) {
          statusText.textContent = "INATIVO";
        }
        hintText.textContent = "Clique no microfone para falar";
      };

      recognition.onerror = (e) => {
        hintText.textContent = "Erro: " + e.error;
        recognition.onend();
      };
    }

    micBtn.addEventListener("click", () => {
      if (isListening) {
        recognition.stop();
      } else {
        transcriptEl.textContent = "aguardando fala...";
        transcriptEl.classList.remove("active");
        hideAiMessage();
        recognition.start();
      }
    });

    // ── GEMINI ──
    async function processCommand(texto) {
      setProcessing();

      const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

      const prompt = `
Você é um assistente de controle de navegador por voz.

Comando do usuário: "${texto}"
      `.trim();

      try {
        const result = await model.generateContent(prompt);
        const resposta = result.response.text().trim();

        statusDot.classList.add("active");
        statusText.textContent = "PRONTO";

        if (resposta.toUpperCase().startsWith("EXECUTAR")) {
          // Comando claro — sem mensagem na tela
          hideAiMessage();
          hintText.textContent = `✓ Executando: "${texto}"`;
          setTimeout(() => {
            hintText.textContent = "Clique no microfone para falar";
            statusDot.classList.remove("active");
            statusText.textContent = "INATIVO";
          }, 2500);
        } else {
          // IA precisa perguntar algo
          showAiMessage(resposta);
        }
      } catch (err) {
        showAiMessage("Erro ao conectar com a IA.");
        console.error(err);
      }
    }

    // ── UI HELPERS ──
    function setProcessing() {
      statusDot.classList.remove("active", "listening");
      statusText.textContent = "PROCESSANDO";
      hintText.textContent = "Analisando comando...";
      aiText.textContent = "";
      cursor.classList.add("visible");
      aiMessage.classList.add("has-message");
      aiLabel.classList.add("active");
      aiText.classList.remove("has-content");
    }

    function showAiMessage(msg) {
      cursor.classList.remove("visible");
      aiLabel.classList.add("active");
      aiMessage.classList.add("has-message");

      // efeito de digitação
      aiText.textContent = "";
      aiText.classList.add("has-content");
      let i = 0;
      const interval = setInterval(() => {
        aiText.textContent += msg[i];
        i++;
        if (i >= msg.length) clearInterval(interval);
      }, 28);
    }

    function hideAiMessage() {
      aiMessage.classList.remove("has-message");
      aiLabel.classList.remove("active");
      aiText.classList.remove("has-content");
      aiText.textContent = "Nenhuma mensagem pendente";
      cursor.classList.remove("visible");
    }
  </script>
</body>
</html>
