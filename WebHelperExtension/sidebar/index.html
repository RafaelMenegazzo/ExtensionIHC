<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebHelper</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
        <div>
          <div class="logo-text">WebHelper</div>
          <div class="logo-sub">VOICE CONTROL</div>
        </div>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">INATIVO</span>
      </div>
    </div>

    <!-- WAVEFORM / MIC -->
    <div class="waveform-area">
      <button class="mic-btn" id="micBtn" title="Clique para falar">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <div class="hint-text" id="hintText">Clique no microfone para falar</div>
    </div>

    <!-- O QUE O USUÁRIO FALOU -->
    <div class="transcript">
      <span class="transcript-label">VOCÊ</span>
      <span class="transcript-text" id="transcriptText">aguardando fala...</span>
    </div>

    <!-- RESPOSTA / DÚVIDA DA IA -->
    <div class="ai-message" id="aiMessage">
      <div class="ai-label" id="aiLabel">IA</div>
      <div class="ai-text" id="aiText">Nenhuma mensagem pendente</div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <span class="model-tag">gemini-2.5-flash</span>
      <button class="settings-btn" id="settingsBtn" title="Configurações">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
